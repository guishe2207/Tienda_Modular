<main class="confirmation-shell">@if (pedido(); as compra) { <section class="confirmation-card"><div class="check" aria-hidden="true">✓</div><p class="eyebrow">COMPRA CONFIRMADA</p><h1>¡Compra confirmada!</h1><p>Tu pedido se ha registrado correctamente.</p><p class="order">Pedido: <strong>#{{ compra.idPedido }}</strong></p><p class="total">Total: <strong>{{ compra.total | currency:'COP':'symbol-narrow':'1.0-0' }}</strong></p><p class="simulation">Este pago ha sido simulado. No se realizó ningún cobro real.</p><a routerLink="/" (click)="volver()">← Volver a la tienda</a></section> }</main>
