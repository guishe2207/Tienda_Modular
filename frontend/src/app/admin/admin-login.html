<main class="admin-shell admin-login">
  <a class="back-link" routerLink="/">← Volver al catálogo</a>

  <form class="admin-card" [formGroup]="form" (ngSubmit)="submit()">
    <p class="eyebrow">ADMINISTRACIÓN</p>
    <h1>Iniciar sesión</h1>

    <label class="field">
      <span>Usuario</span>
      <input formControlName="usuario" autocomplete="username">
    </label>

    <label class="field">
      <span>Contraseña</span>
      <input type="password" formControlName="password" autocomplete="current-password">
    </label>

    @if (error()) {
      <p class="form-error" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="primary-button" [disabled]="enviando()">
      {{ enviando() ? 'Entrando...' : 'Entrar' }}
    </button>
  </form>
</main>
